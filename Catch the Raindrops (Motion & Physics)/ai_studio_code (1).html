<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampath Vishwa - Wealth Rain</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --sampath-orange: #f37021;
            --deep-navy: #050b18;
            --gold: #d4af37;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: white;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        #app-container {
            position: relative;
            width: 100vh; height: 177.78vh;
            max-width: 100vw; max-height: 100vh;
            background: var(--deep-navy);
            overflow: hidden; border-radius: 20px;
        }

        video { display: none; }
        canvas { width: 100%; height: 100%; }

        .ui-overlay {
            position: absolute; inset: 0; pointer-events: none; z-index: 10;
        }

        .header {
            padding: 40px; display: flex; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(5,11,24,0.9), transparent);
        }

        .vault-progress {
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
            width: 70%; height: 14px; background: rgba(255,255,255,0.1);
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); overflow: hidden;
        }

        #progressBar {
            width: 0%; height: 100%; background: linear-gradient(90deg, var(--sampath-orange), var(--gold));
            box-shadow: 0 0 15px var(--sampath-orange); transition: width 0.3s;
        }

        .screen {
            position: absolute; inset: 0; background: rgba(5, 11, 24, 0.98);
            z-index: 100; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 40px;
        }

        .btn-start {
            background: var(--sampath-orange); color: white; border: none;
            padding: 22px 60px; font-size: 1.4rem; font-weight: bold;
            border-radius: 50px; cursor: pointer; margin-top: 30px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app-container">
        <video id="webcam_in"></video>
        <canvas id="game_canvas"></canvas>

        <div class="ui-overlay">
            <div class="header">
                <div>
                    <div style="font-size: 0.8rem; opacity: 0.6; letter-spacing: 1px;">TOTAL SAVINGS</div>
                    <div id="scoreLabel" style="font-size: 2.2rem; font-weight: 900;">LKR 0</div>
                </div>
                <div id="timerLabel" style="font-size: 2.5rem; font-weight: 800; color: var(--gold);">00:45</div>
            </div>

            <div class="vault-progress">
                <div id="progressBar"></div>
            </div>
            <div style="position:absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: var(--gold);">SAMPATH VISHWA DIGITAL VAULT</div>
        </div>

        <div id="startScreen" class="screen">
            <h1 style="color: var(--sampath-orange); font-size: 2.8rem;">Rain of Wealth</h1>
            <p>Cup your hands together to catch<br>the interest badges and coins!</p>
            <button class="btn-start" onclick="startGame()">START EXPERIENCE</button>
        </div>

        <div id="winScreen" class="screen hidden">
            <h1 style="color: var(--gold); font-size: 3rem;">Savings Secured!</h1>
            <p>Start growing your wealth today on Sampath Vishwa.</p>
            <div id="finalScore" style="font-size: 3rem; margin: 20px 0; font-weight: 900;"></div>
            <button class="btn-start" onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

<script>
    const video = document.getElementById('webcam_in');
    const canvas = document.getElementById('game_canvas');
    const ctx = canvas.getContext('2d');
    
    let score = 0;
    let timeLeft = 45;
    let gameActive = false;
    let coins = [];
    let progress = 0;
    let handsList = [];

    // Web Audio SFX
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPing() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(1000 + Math.random()*500, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // MediaPipe Setup
    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5 });
    
    hands.onResults(results => {
        handsList = results.multiHandLandmarks || [];
        drawFrame(results.image);
    });

    const camera = new Camera(video, {
        onFrame: async () => { await hands.send({image: video}); },
        width: 720, height: 1280
    });
    camera.start();

    function startGame() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('startScreen').classList.add('hidden');
        gameActive = true;
        
        const timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timerLabel').innerText = `00:${timeLeft.toString().padStart(2, '0')}`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                gameActive = false;
                document.getElementById('winScreen').classList.remove('hidden');
                document.getElementById('finalScore').innerText = `LKR ${score.toLocaleString()}`;
            }
        }, 1000);
    }

    function spawn() {
        if (!gameActive) return;
        const type = Math.random() > 0.8 ? 'RATE' : 'COIN';
        coins.push({
            x: 50 + Math.random() * (canvas.width - 100),
            y: -50,
            vy: 4 + Math.random() * 4,
            type: type,
            label: type === 'RATE' ? `+${[10, 12, 15][Math.floor(Math.random()*3)]}%` : ''
        });
    }
    setInterval(spawn, 500);

    function drawFrame(img) {
        if (canvas.width !== canvas.clientWidth) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        ctx.save();
        ctx.clearRect(0,0, canvas.width, canvas.height);

        // 1. Mirror Background
        ctx.scale(-1, 1);
        ctx.translate(-canvas.width, 0);
        ctx.globalAlpha = 0.7;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        // 2. Interaction Bridge (Hands)
        let bridge = null;
        if (handsList.length === 2) {
            const h1 = handsList[0][9]; // Palm center
            const h2 = handsList[1][9];
            
            // Map landmarks correctly (1 - x because video is mirrored)
            bridge = {
                x1: (1 - h1.x) * canvas.width,
                y1: h1.y * canvas.height,
                x2: (1 - h2.x) * canvas.width,
                y2: h2.y * canvas.height
            };

            ctx.beginPath();
            ctx.strokeStyle = 'var(--gold)';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 20; ctx.shadowColor = 'var(--gold)';
            ctx.moveTo(bridge.x1, bridge.y1);
            ctx.lineTo(bridge.x2, bridge.y2);
            ctx.stroke();
            ctx.restore();
        }

        if (!gameActive) return;

        // 3. Vault & Coins
        const vaultX = canvas.width / 2;
        const vaultY = canvas.height - 100;
        
        coins.forEach((coin, i) => {
            coin.y += coin.vy;

            // Collision with Hand Bridge
            if (bridge) {
                const dist = distToSegment(coin.x, coin.y, bridge.x1, bridge.y1, bridge.x2, bridge.y2);
                if (dist < 40) {
                    // Funnel toward vault center
                    coin.x += (vaultX - coin.x) * 0.15;
                    coin.vy = 2.5; // Slow down for collection
                }
            }

            // Collection
            const distVault = Math.hypot(coin.x - vaultX, coin.y - vaultY);
            if (distVault < 100) {
                score += coin.type === 'RATE' ? 5000 : 1000;
                progress = Math.min(100, progress + 3);
                playPing();
                document.getElementById('scoreLabel').innerText = `LKR ${score.toLocaleString()}`;
                document.getElementById('progressBar').style.width = `${progress}%`;
                coins.splice(i, 1);
                return;
            }

            // Render Coin/Badge
            ctx.save();
            ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.fillStyle = coin.type === 'RATE' ? 'var(--sampath-orange)' : 'var(--gold)';
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, coin.type === 'RATE' ? 35 : 22, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = 'bold 14px Arial';
            if (coin.type === 'RATE') ctx.fillText(coin.label, coin.x, coin.y + 5);
            else {
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath(); ctx.arc(coin.x, coin.y, 16, 0, Math.PI*2); ctx.stroke();
            }
            ctx.restore();

            if (coin.y > canvas.height + 50) coins.splice(i, 1);
        });
    }

    // Helper: Distance from point to line segment
    function distToSegment(px, py, x1, y1, x2, y2) {
        const l2 = Math.hypot(x1 - x2, y1 - y2) ** 2;
        if (l2 === 0) return Math.hypot(px - x1, py - y1);
        let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }
</script>
</body>
</html>
